<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Styles -->
  <style>
    .terrain { fill: #F8FAFC; }
    .water { fill: #E0F2FE; }
    .wave { stroke: #BAE6FD; stroke-width: 2; fill: none; opacity: 0.5; }
    .road { fill: none; stroke: #FFFFFF; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    .road-border { fill: none; stroke: #E2E8F0; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    .footpath { fill: none; stroke: #F1F5F9; stroke-width: 8; stroke-dasharray: 4 4; }
    .garden { fill: #D1FAE5; stroke: #A7F3D0; stroke-width: 1; }
    .building { fill: #F1F5F9; stroke: #CBD5E1; stroke-width: 2; rx: 4; ry: 4; }
    .temple-base { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 2; rx: 4; ry: 4; }
    .temple-core { fill: #FFEDD5; stroke: #F97316; stroke-width: 3; rx: 2; ry: 2; }
    .wall { fill: none; stroke: #94A3B8; stroke-width: 3; opacity: 0.5; }
    .promenade { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 12; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; pointer-events: none; }
    .label-title { font-size: 16px; font-weight: 800; fill: #1E293B; pointer-events: none; text-anchor: middle; }
    .label-water { fill: #38BDF8; font-style: italic; font-size: 24px; font-weight: 800; opacity: 0.5; letter-spacing: 4px; pointer-events: none; text-anchor: middle; }
  </style>

  <!-- Base Terrain -->
  <rect width="800" height="600" class="terrain" />

  <!-- Arabian Sea (South) -->
  <path d="M 0 450 Q 200 440 400 460 T 800 440 L 800 600 L 0 600 Z" class="water" />
  
  <!-- Sea Waves Decor -->
  <path d="M 50 480 Q 75 470 100 480 T 150 480" class="wave" />
  <path d="M 250 520 Q 275 510 300 520 T 350 520" class="wave" />
  <path d="M 550 470 Q 575 460 600 470 T 650 470" class="wave" />
  <path d="M 400 560 Q 425 550 450 560 T 500 560" class="wave" />
  <text x="400" y="550" class="label-water">ARABIAN SEA</text>

  <!-- Main Roads -->
  <path d="M 400 0 L 400 150 Q 400 200 450 200 L 800 200" class="road-border" />
  <path d="M 400 0 L 400 150 Q 400 200 450 200 L 800 200" class="road" />
  
  <path d="M 150 0 L 150 300 Q 150 350 200 350 L 800 350" class="road-border" />
  <path d="M 150 0 L 150 300 Q 150 350 200 350 L 800 350" class="road" />

  <!-- Promenade (Sea Wall Walkway) -->
  <path d="M -20 420 Q 200 410 400 430 T 820 410" class="promenade" />
  
  <!-- Temple Campus Boundary -->
  <rect x="250" y="200" width="350" height="200" rx="16" ry="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="4" />
  <path d="M 250 200 L 600 200 L 600 400 L 250 400 Z" class="wall" rx="16" ry="16" />

  <!-- Gardens within Campus -->
  <rect x="270" y="220" width="100" height="160" rx="8" ry="8" class="garden" />
  <rect x="480" y="220" width="100" height="160" rx="8" ry="8" class="garden" />

  <!-- Main Temple Structure (Somnath) -->
  <g transform="translate(400, 310)">
    <!-- Parikrama / Courtyard base -->
    <rect x="-60" y="-50" width="120" height="100" class="temple-base" />
    
    <!-- Sabha Mandap -->
    <rect x="-40" y="-30" width="60" height="60" class="temple-core" />
    <path d="M -40 -30 L 20 30 M 20 -30 L -40 30" stroke="#FDBA74" stroke-width="1" opacity="0.5" />
    
    <!-- Garbhagriha (Sanctum) -->
    <rect x="20" y="-20" width="40" height="40" class="temple-core" fill="#F97316" />
    <circle cx="40" cy="0" r="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" />
    
    <!-- Flag Mast (Dhwaja) -->
    <line x1="40" y1="0" x2="40" y2="-40" stroke="#94A3B8" stroke-width="2" />
    <polygon points="40,-40 60,-35 40,-30" fill="#EF4444" />
  </g>

  <!-- Other Campus Buildings -->
  <rect x="500" y="340" width="60" height="40" class="building" /> <!-- Administration -->
  <rect x="280" y="230" width="50" height="40" class="building" /> <!-- Prasad/Cloak -->
  <rect x="280" y="330" width="40" height="30" class="building" /> <!-- VIP Wait -->
  
  <!-- External Buildings / Infrastructure -->
  <rect x="420" y="50" width="120" height="80" class="building" /> <!-- Guest House -->
  <rect x="650" y="250" width="80" height="60" class="building" /> <!-- Museum -->
  
  <!-- Parking Lots -->
  <rect x="180" y="50" width="180" height="120" rx="4" ry="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 4" />
  
  <!-- Labels -->
  <!-- Temple -->
  <text x="400" y="295" class="label-title">Shree Somnath Jyotirlinga</text>
  <text x="370" y="315" class="label">Sabha Mandap</text>
  <text x="440" y="325" class="label" fill="#FFFFFF">Sanctum</text>
  
  <!-- Gates -->
  <text x="425" y="215" class="label" fill="#B91C1C">Digvijay Dwar (Main Entry)</text>
  <circle cx="425" cy="200" r="6" fill="#EF4444" />
  
  <text x="250" y="215" class="label" fill="#B91C1C">VIP Gate</text>
  <circle cx="250" cy="200" r="6" fill="#EF4444" />

  <!-- Infrastructure -->
  <text x="270" y="115" class="label">Public Parking Area A</text>
  <text x="480" y="95" class="label">Somnath Trust Guest House</text>
  <text x="690" y="285" class="label" text-anchor="middle">Prabhas Museum</text>
  
  <!-- Inner Facilities -->
  <text x="305" y="255" class="label" text-anchor="middle">Cloak Room</text>
  <text x="300" y="350" class="label" text-anchor="middle">Medical</text>
  <text x="530" y="365" class="label" text-anchor="middle">Admin</text>

  <text x="400" y="425" class="label" text-anchor="middle">Sea View Promenade</text>
</svg>
