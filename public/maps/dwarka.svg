<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    .terrain { fill: #F1F5F9; }
    .water { fill: #BAE6FD; }
    .wave { stroke: #7DD3FC; stroke-width: 2; fill: none; opacity: 0.6; }
    .road { fill: none; stroke: #FFFFFF; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
    .road-border { fill: none; stroke: #CBD5E1; stroke-width: 20; stroke-linecap: round; stroke-linejoin: round; }
    .ghat { fill: #E2E8F0; stroke: #94A3B8; stroke-width: 2; }
    .ghat-step { fill: none; stroke: #CBD5E1; stroke-width: 1; }
    .city-block { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; rx: 4; ry: 4; }
    .temple-base { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 2; rx: 4; ry: 4; }
    .temple-core { fill: #FFEDD5; stroke: #F97316; stroke-width: 3; rx: 2; ry: 2; }
    .label { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; pointer-events: none; }
    .label-title { font-size: 16px; font-weight: 800; fill: #1E293B; pointer-events: none; text-anchor: middle; }
    .label-water { fill: #0284C7; font-style: italic; font-size: 24px; font-weight: 800; opacity: 0.5; letter-spacing: 4px; pointer-events: none; text-anchor: middle; }
  </style>

  <!-- Terrain -->
  <rect width="800" height="600" class="terrain" />

  <!-- Gomti River (Left / Bottom-Left) -->
  <path d="M 0 0 L 150 0 L 180 300 Q 200 450 100 600 L 0 600 Z" class="water" />
  
  <path d="M 50 100 Q 75 90 100 100 T 150 100" class="wave" />
  <path d="M 60 300 Q 85 290 110 300 T 160 300" class="wave" />
  <path d="M 40 500 Q 65 490 90 500 T 140 500" class="wave" />
  <text x="75" y="300" class="label-water" transform="rotate(-75 75,300)">GOMTI RIVER</text>

  <!-- Gomti Ghats -->
  <path d="M 150 0 L 180 300 Q 200 450 100 600 L 120 600 Q 230 450 200 300 L 170 0 Z" class="ghat" />
  <!-- Ghat steps texture -->
  <path d="M 155 50 L 175 50 M 158 100 L 178 100 M 161 150 L 181 150 M 165 200 L 185 200 M 172 250 L 192 250" class="ghat-step" />

  <!-- Main City Roads -->
  <path d="M 400 0 L 400 600" class="road-border" />
  <path d="M 400 0 L 400 600" class="road" />

  <path d="M 200 150 L 800 150" class="road-border" />
  <path d="M 200 150 L 800 150" class="road" />
  
  <path d="M 200 400 L 800 400" class="road-border" />
  <path d="M 200 400 L 800 400" class="road" />

  <!-- Surrounding City Blocks (Dense Urban) -->
  <rect x="420" y="20" width="360" height="110" class="city-block" />
  <rect x="420" y="170" width="160" height="210" class="city-block" />
  <rect x="600" y="170" width="180" height="210" class="city-block" />
  <rect x="420" y="420" width="360" height="160" class="city-block" />
  <rect x="220" y="420" width="160" height="160" class="city-block" />

  <!-- Main Temple Complex Boundary -->
  <rect x="220" y="170" width="160" height="210" rx="8" ry="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4" />

  <!-- Dwarkadhish Main Shrine -->
  <g transform="translate(300, 260)">
    <!-- Main base -->
    <rect x="-50" y="-60" width="100" height="120" class="temple-base" />
    
    <!-- 5 Story Spire Representation (Garbhagriha) -->
    <rect x="-30" y="-40" width="60" height="60" class="temple-core" fill="#F97316" />
    <rect x="-20" y="-30" width="40" height="40" fill="#EA580C" />
    <rect x="-10" y="-20" width="20" height="20" fill="#C2410C" />
    
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    
    <!-- Flag Mast -->
    <line x1="0" y1="-40" x2="0" y2="-70" stroke="#94A3B8" stroke-width="2" />
    <polygon points="0,-70 20,-65 0,-60" fill="#EF4444" />
    <text x="25" y="-65" class="label" fill="#EF4444" font-size="10">Dhwajaji</text>
  </g>

  <!-- Subsidiary Shrines & Structures -->
  <rect x="230" y="180" width="40" height="30" class="temple-base" />
  <rect x="330" y="180" width="40" height="30" class="temple-base" />
  <rect x="230" y="340" width="40" height="30" class="temple-base" />

  <!-- Entry/Exit Gates -->
  <circle cx="300" cy="170" r="8" fill="#EF4444" />
  <text x="300" y="160" class="label" text-anchor="middle" fill="#B91C1C">Moksha Dwar (Entry)</text>

  <circle cx="220" cy="260" r="8" fill="#3B82F6" />
  <text x="210" y="255" class="label" text-anchor="end" fill="#1D4ED8">Swarga Dwar (Exit to Ghats)</text>

  <!-- Labels -->
  <text x="300" y="360" class="label-title">Shree Dwarkadhish</text>
  <text x="300" y="375" class="label-title">Jagat Mandir</text>
  
  <text x="180" y="120" class="label">Gomti Ghats</text>
  <text x="500" y="270" class="label" text-anchor="middle">Dense City Center</text>
  <text x="600" y="80" class="label" text-anchor="middle">Public Parking Plaza</text>

  <!-- Infrastructure -->
  <rect x="680" y="30" width="80" height="40" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4 2" />
  <text x="720" y="55" class="label" text-anchor="middle" font-size="10">Parking</text>

  <rect x="230" y="440" width="60" height="40" fill="#FEF2F2" stroke="#FCA5A5" />
  <text x="260" y="465" class="label" text-anchor="middle" fill="#B91C1C" font-size="10">Medical</text>
</svg>
