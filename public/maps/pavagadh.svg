<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <style>
    .terrain { fill: #ECFDF5; }
    .contour-1 { fill: #D1FAE5; }
    .contour-2 { fill: #A7F3D0; }
    .contour-3 { fill: #6EE7B7; }
    .contour-4 { fill: #34D399; }
    
    .water { fill: #BAE6FD; stroke: #7DD3FC; stroke-width: 2; }
    
    .ropeway-cable { fill: none; stroke: #94A3B8; stroke-width: 4; stroke-dasharray: 12 12; }
    .ropeway-station { fill: #FFFFFF; stroke: #64748B; stroke-width: 3; rx: 4; ry: 4; }
    .gondola { fill: #EF4444; }
    
    .trek-path { fill: none; stroke: #FFFFFF; stroke-width: 12; stroke-dasharray: 4 4; stroke-linecap: round; stroke-linejoin: round; }
    .trek-border { fill: none; stroke: #94A3B8; stroke-width: 16; stroke-dasharray: 4 4; stroke-linecap: round; stroke-linejoin: round; }
    
    .building { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 2; rx: 4; ry: 4; }
    
    .temple-base { fill: #FFF7ED; stroke: #FDBA74; stroke-width: 3; rx: 8; ry: 8; }
    .temple-core { fill: #FFEDD5; stroke: #F97316; stroke-width: 4; rx: 4; ry: 4; }
    
    .label { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; fill: #1E293B; pointer-events: none; }
    .label-title { font-size: 16px; font-weight: 900; fill: #064E3B; pointer-events: none; text-anchor: middle; }
    .label-white { font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 800; fill: #FFFFFF; pointer-events: none; text-anchor: middle; }
  </style>

  <!-- Base Terrain -->
  <rect width="800" height="600" class="terrain" />

  <!-- Topographic Contours (Hill representation) -->
  <path d="M 0 100 Q 400 -50 800 150 L 800 600 L 0 600 Z" class="contour-1" />
  <path d="M 50 200 Q 400 50 750 250 L 750 600 L 50 600 Z" class="contour-2" />
  <path d="M 150 300 Q 400 150 650 350 L 650 600 L 150 600 Z" class="contour-3" />
  <path d="M 250 400 Q 400 250 550 450 L 550 600 L 250 600 Z" class="contour-4" />

  <!-- Dadhiya Talao (Historical Lake) -->
  <path d="M 120 400 Q 150 380 200 420 Q 180 480 140 450 Z" class="water" />
  <text x="160" y="440" class="label" fill="#0369A1" font-size="10" text-anchor="middle">Dadhiya Talao</text>

  <!-- Trekking Path (Stone Steps) -->
  <path d="M 400 600 Q 300 500 250 450 Q 200 400 250 350 Q 300 300 400 250 Q 500 200 450 150 Q 420 120 400 100" class="trek-border" />
  <path d="M 400 600 Q 300 500 250 450 Q 200 400 250 350 Q 300 300 400 250 Q 500 200 450 150 Q 420 120 400 100" class="trek-path" />

  <!-- Ropeway (Udan Khatola) -->
  <line x1="600" y1="500" x2="450" y2="150" class="ropeway-cable" />
  <!-- Gondolas -->
  <circle cx="560" cy="406" r="6" class="gondola" />
  <circle cx="510" cy="290" r="6" class="gondola" />
  <circle cx="480" cy="220" r="6" class="gondola" />
  
  <!-- Lower Ropeway Station (Machi) -->
  <rect x="570" y="480" width="60" height="40" class="ropeway-station" />
  <text x="600" y="505" class="label" text-anchor="middle">Lower Station</text>
  
  <!-- Upper Ropeway Station -->
  <rect x="420" y="130" width="60" height="40" class="ropeway-station" />
  <text x="450" y="155" class="label" text-anchor="middle">Upper Station</text>

  <!-- Rest Facilities along the trek -->
  <rect x="260" y="360" width="30" height="20" class="building" />
  <rect x="420" y="240" width="40" height="30" class="building" />

  <!-- Mahakali Peak Shrine Complex -->
  <g transform="translate(400, 80)">
    <!-- Plaza Base -->
    <rect x="-60" y="-50" width="120" height="100" class="temple-base" />
    
    <!-- Main Sanctum -->
    <rect x="-30" y="-30" width="60" height="60" class="temple-core" />
    <circle cx="0" cy="0" r="16" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" />
    
    <!-- Dhwaja (Flag) -->
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#475569" stroke-width="2" />
    <polygon points="0,-60 20,-55 0,-50" fill="#EF4444" />
  </g>

  <!-- Labels -->
  <text x="400" y="18" class="label-title">Shree Mahakali Mataji Temple</text>
  <text x="400" y="35" class="label-title" font-size="12">Pavagadh Hill Summit</text>
  
  <text x="400" y="85" class="label-white">Garbhagriha</text>

  <text x="310" y="490" class="label" fill="#047857" transform="rotate(-45 310,490)">Ancient Stone Steps (Trek Route)</text>
  
  <text x="590" y="320" class="label" fill="#B91C1C" transform="rotate(-66 590,320)">Udan Khatola (Ropeway)</text>

  <text x="440" y="235" class="label" text-anchor="middle">Medical / Rest</text>

</svg>
